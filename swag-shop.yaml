# Source: manifests/swag-shop-pricing-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swag-shop-pricing
  labels:
    app.kubernetes.io/name: swag-shop-pricing
    app.kubernetes.io/component: pricing
    app.kubernetes.io/part-of: swag-shop-demo
    # Shows the Quarkus icon in the OpenShift topology view
    app.openshift.io/runtime: quarkus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: swag-shop-pricing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swag-shop-pricing
        app.kubernetes.io/component: pricing
        app.kubernetes.io/part-of: swag-shop-demo
        # The Cryostat Operator injects the Cryostat Agent into pods with these labels
        cryostat.io/name: cryostat-sample
        cryostat.io/namespace: cryostat
    spec:
      containers:
        - name: pricing
          image: quay.io/mostmark/swag-shop-pricing:latest
          # Always pull, so restarting the pod picks up a newly pushed :latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # A small heap makes the memory leak visible within a couple of minutes
            - name: JAVA_OPTS_APPEND
              value: >-
                -Xms128m -Xmx384m
                -Dquarkus.http.host=0.0.0.0
                -Djava.util.logging.manager=org.jboss.logmanager.LogManager
            # The image defaults to ParallelGC; use G1 (the JVM default), as when the services run locally
            - name: GC_CONTAINER_OPTIONS
              value: '-XX:+UseG1GC'
            # The products are fetched from the catalog at start-up
            - name: CATALOG_URL
              value: 'http://swag-shop-catalog:8080'
            # Smart trigger: when the heap stays more than 35 % full for 20 seconds (garbage alone never does that),
            # the Agent starts a recording with the memory leak template by itself.
            # (ProcessCpuLoad is not usable here: Cryostat Agent 0.7 reads it as 0.0 even when the CPU is busy.)
            - name: CRYOSTAT_AGENT_SMART_TRIGGER_DEFINITIONS
              value: '[HeapMemoryUsagePercent>0.35;TargetDuration>duration("20s")]~SwagShopMemoryLeak'
          resources:
            # The CPU request is kept small: it is what the scheduler reserves, not what the service may use
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            # A busy demo must never be restarted by the liveness probe
            timeoutSeconds: 5
            failureThreshold: 6
