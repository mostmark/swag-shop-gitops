# All manifests from manifests/ in one file. Deploy with: oc apply -f swag-shop.yaml
# or paste into Import YAML in the OpenShift console.
---
# Source: manifests/swag-shop-catalog-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swag-shop-catalog
  labels:
    app.kubernetes.io/name: swag-shop-catalog
    app.kubernetes.io/component: catalog
    app.kubernetes.io/part-of: swag-shop-demo
    # Shows the Quarkus icon in the OpenShift topology view
    app.openshift.io/runtime: quarkus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: swag-shop-catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swag-shop-catalog
        app.kubernetes.io/component: catalog
        app.kubernetes.io/part-of: swag-shop-demo
        # The Cryostat Operator injects the Cryostat Agent into pods with these labels
        cryostat.io/name: cryostat-sample
        cryostat.io/namespace: cryostat
    spec:
      containers:
        - name: catalog
          image: quay.io/mostmark/swag-shop-catalog:latest
          # Always pull, so restarting the pod picks up a newly pushed :latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: JAVA_OPTS_APPEND
              value: >-
                -Xmx128m
                -Dquarkus.http.host=0.0.0.0
                -Djava.util.logging.manager=org.jboss.logmanager.LogManager
            # The image defaults to ParallelGC; use G1 (the JVM default), as when the services run locally
            - name: GC_CONTAINER_OPTIONS
              value: '-XX:+UseG1GC'
          resources:
            # The CPU request is kept small: it is what the scheduler reserves, not what the service may use
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            # A busy demo must never be restarted by the liveness probe
            timeoutSeconds: 5
            failureThreshold: 6
---
